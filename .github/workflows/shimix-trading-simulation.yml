name: SHIMIX Trading - simulation automatique
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: shimix-trading-simulation
  cancel-in-progress: false
jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: shimix-hub
      - name: Verifier les limites et le mode simulation
        run: |
          python3 - <<'PY'
          import json,runpy
          checks=runpy.run_path('hub/trading/autonomous_simulation.py',run_name='validation_only')
          with open('hub/trading/robot-state.json',encoding='utf-8') as f:
              state=json.load(f)
          checks['validate_simulation_state'](state)
          print('Etat et limites de simulation valides')
          PY
        env:
          GITHUB_TOKEN: validation-only
      - name: Verifier la syntaxe du robot
        run: python3 -m py_compile hub/trading/autonomous_simulation.py
      - name: Tester la validation des cours
        run: python3 -m unittest discover -s hub/trading -p 'test_market_validation.py' -v
      - name: Exécuter le robot fictif (aucun ordre réel)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHIMIX_BRANCH: shimix-hub
        run: python3 hub/trading/autonomous_simulation.py
