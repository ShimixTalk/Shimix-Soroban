name: SHIMIX Trading - simulation automatique
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: shimix-trading-simulation
  cancel-in-progress: false
jobs:
  simulate:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/shimix-hub'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: shimix-hub
          persist-credentials: false
      - name: Offline regression tests
        run: python3 -m unittest discover -s hub/trading -v
      - name: Exécuter le robot fictif (aucun ordre réel)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHIMIX_BRANCH: shimix-hub
        run: python3 hub/trading/autonomous_simulation.py
