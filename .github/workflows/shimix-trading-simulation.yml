name: SHIMIX Trading - simulation automatique
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: shimix-trading-simulation
  cancel-in-progress: false
jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: shimix-hub
      - name: Bloquer toute configuration non fictive avant execution
        shell: bash
        run: |
          python3 - <<'PY'
          import json,pathlib,math,sys
          path=pathlib.Path('hub/trading/robot-state.json')
          state=json.loads(path.read_text(encoding='utf-8'))
          failures=[]
          if state.get('realTradingEnabled') is not False: failures.append('realTradingEnabled doit etre false')
          if state.get('exchangeApiConnected') is not False: failures.append('exchangeApiConnected doit etre false')
          if state.get('readiness',{}).get('liveOrdersEnabled') is True: failures.append('liveOrdersEnabled doit etre desactive')
          if state.get('readiness',{}).get('simulationOnly') is not True: failures.append('simulationOnly doit etre true')
          for field in ('capital','cash','maxOrder'):
              value=state.get(field)
              if type(value) not in (int,float) or not math.isfinite(value) or value<0: failures.append(field+' invalide')
          if failures:
              for failure in failures: print('BLOQUE:',failure)
              sys.exit(1)
          print('Simulation verifiee : execution fictive uniquement')
          PY
      - name: Verifier la syntaxe du robot
        run: python3 -m py_compile hub/trading/autonomous_simulation.py
      - name: Exécuter le robot fictif (aucun ordre réel)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHIMIX_BRANCH: shimix-hub
        run: python3 hub/trading/autonomous_simulation.py
