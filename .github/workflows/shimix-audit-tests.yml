name: SHIMIX simulation regression tests
on:
  push:
    branches: ['audit/**', shimix-hub]
  pull_request:
    branches: [shimix-hub]
permissions:
  contents: read
jobs:
  simulation-and-browser:
    runs-on: ubuntu-latest
    container:
      # Playwright 1.62.0 / Ubuntu 24.04, pinned to the verified official image.
      image: mcr.microsoft.com/playwright/python@sha256:aa81288e738725378becba5b3e06cb0f3a7f012a610e87e8d767a090ea3f740d
      options: --ipc=host
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Trust only the checked-out test workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Python accounting and risk regressions (offline)
        run: python3 -m unittest discover -s hub/trading -v
      - name: Browser test dependencies
        run: |
          python3 -m pip install -r tests/requirements.txt
      - name: Encrypted restore and browser safety (localhost, synthetic data)
        run: python3 tests/browser_security.py
