name: SHIMIX Trading - SHIB DOGE historique
on:
  schedule:
    - cron: '13 5 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: shimix-meme-history
  cancel-in-progress: false
jobs:
  research:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/shimix-hub'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: shimix-hub
          persist-credentials: false
      - name: Analyse historique sans ordres réels
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 hub/trading/meme_history.py
