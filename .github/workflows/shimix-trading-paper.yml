name: SHIMIX Trading paper robot
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/shimix-trading-paper.yml'
      - 'scripts/shimix-paper-robot.mjs'
      - 'scripts/shimix-three-portfolios.mjs'
      - 'scripts/shimix-market-scanner.mjs'
      - 'scripts/simulation-safety.mjs'
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: shimix-paper-robot
  cancel-in-progress: false
jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Offline safety regressions
        run: node --test tests/*.test.mjs
      - name: Validate automation scripts
        run: |
          node --check scripts/shimix-paper-robot.mjs
          node --check scripts/shimix-three-portfolios.mjs
          node --check scripts/shimix-market-scanner.mjs
      - name: Primary state has a single writer
        run: echo 'robot-state.json is maintained by shimix-trading-simulation.yml only'
      - name: Update three risk portfolios
        id: portfolios
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/shimix-three-portfolios.mjs
      - name: Cool down before market scan
        run: sleep 65
      - name: Scan global markets
        id: scanner
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/shimix-market-scanner.mjs
      - name: Report each automation status
        if: always()
        env:
          PORTFOLIOS: ${{ steps.portfolios.outcome }}
          SCANNER: ${{ steps.scanner.outcome }}
        run: |
          echo "Three portfolios: $PORTFOLIOS"
          echo "Market scanner: $SCANNER"
          echo "## SHIMIX Trading checks" >> "$GITHUB_STEP_SUMMARY"
          echo "- Three portfolios: $PORTFOLIOS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Scanner: $SCANNER" >> "$GITHUB_STEP_SUMMARY"
          test "$PORTFOLIOS" = success && test "$SCANNER" = success
