<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Shimix Soroban</title><style>*{box-sizing:border-box}body{margin:0;background:#101c30;color:#fff;font:16px system-ui}main{max-width:850px;margin:auto;padding:16px}h1{margin:0 0 5px}.muted{color:#a7bad0}.card{background:#1b2d49;border-radius:16px;padding:16px;margin:14px 0}.value{font-size:48px;font-weight:700}.controls{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}button,select{border:1px solid #57718e;background:#304966;color:#fff;padding:10px;border-radius:10px;font:inherit;cursor:pointer}.board-scroll{overflow:auto;padding:16px;background:#091423;border-radius:14px}.board{display:flex;justify-content:center;gap:7px;background:#a16c40;border:8px solid #714324;border-radius:10px;padding:12px;min-width:max-content;transform-origin:top left}.rod{position:relative;width:42px;height:300px;background:linear-gradient(90deg,transparent 47%,#56331d 47%,#56331d 53%,transparent 53%)}.divider{position:absolute;top:100px;left:-8px;right:-8px;height:13px;background:#4c2c18;z-index:1}.bead{position:absolute;left:1px;width:40px;height:29px;border:1px solid #92511e;border-radius:50%;background:radial-gradient(ellipse at 35% 25%,#f3c37f,#b36b30 60%,#75401d);box-shadow:0 3px 5px #0007;transition:top .13s}.bead.active{background:radial-gradient(ellipse at 35% 25%,#ffe0a7,#d58c39 60%,#75401d)}.label{position:absolute;bottom:0;width:100%;text-align:center;font-size:12px;color:#fff0ce}#feedback{color:#89e0bd;font-weight:600}input{accent-color:#79ddc4}@media(max-width:600px){.rod{width:34px}.bead{width:32px}.board{gap:4px;padding:9px}}body.immersive{overflow:hidden}body.immersive main{max-width:none;padding:0}body.immersive main>h1,body.immersive main>.muted,body.immersive main>.card,body.immersive main>.controls{display:none}body.immersive .board-scroll{position:fixed;inset:0;z-index:10;border-radius:0;display:flex;align-items:center;justify-content:center;padding:4px;overflow:auto;background:#091423}body.immersive .board{transform:scale(var(--immersive-scale,1));transform-origin:center center}body.immersive .exit-tip{display:block}.exit-tip{display:none;position:fixed;bottom:env(safe-area-inset-bottom,8px);left:50%;transform:translateX(-50%);z-index:12;background:#172d4de8;padding:6px 12px;border-radius:12px;font-size:12px;pointer-events:none;white-space:nowrap}.board-scroll{touch-action:pan-x pan-y}.bead{touch-action:manipulation;-webkit-tap-highlight-color:transparent}.board{user-select:none;-webkit-user-select:none}</style></head><body><main><h1>Shimix Soroban</h1><div class="muted">Boulier japonais interactif</div><section class="card"><div class="muted">Résultat</div><div id="value" class="value">0</div><div class="controls"><button id="hide">Masquer</button><button id="undo">Annuler</button><button id="reset">Remettre à zéro</button><button id="sound">Son : oui</button></div></section><div class="board-scroll" id="boardScroll"><div id="board" class="board"></div></div><div class="exit-tip">Double-tape pour quitter le mode agrandi</div><div class="controls"><button id="expand">⛶ Agrandir le boulier</button></div><div class="controls"><label>Colonnes <select id="count"><option>7</option><option selected>9</option><option>13</option></select></label><label>Zoom <input id="zoom" type="range" min="70" max="130" value="100"></label></div><section class="card"><h2>Coach Soroban</h2><div class="controls"><select id="mode"><option value="intro">Découverte</option><option value="add">Addition</option><option value="sub">Soustraction</option><option value="mul">Multiplication</option><option value="div">Division</option></select><button id="exercise">Nouvel exercice</button><button id="check">Vérifier</button><button id="speak">Écouter</button></div><p id="lesson">Une perle du haut vaut 5, chacune des quatre perles du bas vaut 1. Clique sur les perles pour les rapprocher ou les éloigner de la barre.</p><p id="feedback"></p></section></main><script>(()=>{const $=id=>document.getElementById(id);let n=9,cols=[],history=[],target=null,sound=true,audio,immersive=false,lastTap=0;const empty=()=>Array.from({length:n},()=>({top:false,bottom:0}));const value=()=>cols.reduce((s,c)=>s*10+(c.top?5:0)+c.bottom,0);function clickSound(){if(!sound)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=430;g.gain.setValueAtTime(.06,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.07);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+.07)}catch(e){}}function draw(){let board=$('board');board.replaceChildren();cols.forEach((c,i)=>{let rod=document.createElement('div');rod.className='rod';let div=document.createElement('div');div.className='divider';rod.append(div);let top=document.createElement('button');top.className='bead'+(c.top?' active':'');top.style.top=(c.top?65:12)+'px';top.ariaLabel='Perle de cinq';top.onclick=()=>move(i,'top');rod.append(top);for(let b=0;b<4;b++){let bead=document.createElement('button');bead.className='bead'+(b<c.bottom?' active':'');bead.style.top=((b<c.bottom?116:160)+b*32)+'px';bead.ariaLabel='Perle unité';bead.onclick=()=>move(i,'bottom',b);rod.append(bead)}let label=document.createElement('div');label.className='label';label.textContent=i===n-1?'U':i===n-2?'D':i===n-3?'C':'';rod.append(label);board.append(rod)});$('value').textContent=value().toLocaleString('fr-FR')}function move(i,t,b){history.push(JSON.stringify(cols));if(t==='top')cols[i].top=!cols[i].top;else cols[i].bottom=b<cols[i].bottom?b:b+1;clickSound();draw();$('feedback').textContent=''}function setNum(x){cols=empty();String(x).split('').reverse().forEach((d,i)=>{if(i<n)cols[n-1-i]={top:+d>=5,bottom:+d%5}});draw()}$('reset').onclick=()=>{history.push(JSON.stringify(cols));setNum(0)};$('undo').onclick=()=>{if(history.length){cols=JSON.parse(history.pop());draw()}};$('hide').onclick=()=>{let e=$('value');e.style.filter=e.style.filter?'':'blur(14px)';$('hide').textContent=e.style.filter?'Afficher':'Masquer'};$('sound').onclick=()=>{sound=!sound;$('sound').textContent='Son : '+(sound?'oui':'non')};$('count').onchange=e=>{n=+e.target.value;history=[];cols=empty();draw()};$('zoom').oninput=e=>{$('board').style.zoom=e.target.value+'%'};$('expand').onclick=()=>toggleImmersive();function toggleImmersive(){immersive=!immersive;document.body.classList.toggle('immersive',immersive);$('expand').textContent=immersive?'Réduire':'⛶ Agrandir le boulier';if(immersive){let w=window.innerWidth,h=window.innerHeight;let scale=Math.min((w-20)/(n*46+40),(h-20)/330);document.body.style.setProperty('--immersive-scale',Math.min(1.7,scale));try{screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{})}catch(e){}}else{try{screen.orientation&&screen.orientation.unlock&&screen.orientation.unlock()}catch(e){}}} $('boardScroll').addEventListener('touchend',e=>{if(e.changedTouches.length!==1)return;let now=Date.now();if(now-lastTap<360){e.preventDefault();toggleImmersive();lastTap=0}else lastTap=now},{passive:false});$('boardScroll').addEventListener('dblclick',e=>{if(e.pointerType==='touch')return;toggleImmersive()});$('mode').onchange=()=>{target=null;$('lesson').textContent='Choisis « Nouvel exercice » pour commencer.'};$('exercise').onclick=()=>{let mode=$('mode').value;if(mode==='intro'){$('lesson').textContent='Une perle du haut vaut 5. Les perles du bas valent 1 chacune.';return}let a,b,op;if(mode==='add'){a=1+Math.floor(Math.random()*40);b=1+Math.floor(Math.random()*30);target=a+b;op='+'}else if(mode==='sub'){a=20+Math.floor(Math.random()*70);b=1+Math.floor(Math.random()*a);target=a-b;op='−'}else if(mode==='mul'){a=2+Math.floor(Math.random()*8);b=2+Math.floor(Math.random()*8);target=a*b;op='×'}else{b=2+Math.floor(Math.random()*8);target=2+Math.floor(Math.random()*9);a=b*target;op='÷'}setNum(mode==='add'||mode==='sub'?a:0);$('lesson').textContent='Exercice : '+a+' '+op+' '+b+' = ? Affiche le résultat avec les perles.';$('feedback').textContent=''};$('check').onclick=()=>{$('feedback').textContent=target===null?'Commence un exercice.':value()===target?'Bravo, bonne réponse !':'Essaie encore.'};$('speak').onclick=()=>{if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance($('lesson').textContent);u.lang='fr-FR';speechSynthesis.speak(u)}};cols=empty();draw()})();</script></body></html>
